<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .title { font-family: "Times New Roman", serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .label { font-family: "Times New Roman", serif; font-size: 24px; fill: #111827; }
      .actor-label { font-family: "Times New Roman", serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .small { font-family: "Times New Roman", serif; font-size: 20px; fill: #374151; }
      .system { fill: #f8fafc; stroke: #111827; stroke-width: 2.2; }
      .usecase { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .line { stroke: #374151; stroke-width: 2; fill: none; }
      .actor { stroke: #111827; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="820" fill="#ffffff"/>
  <text x="700" y="52" text-anchor="middle" class="title">Sơ đồ Use Case hệ thống TutorConnect</text>

  <rect x="285" y="95" width="830" height="650" rx="8" class="system"/>
  <text x="700" y="130" text-anchor="middle" class="small">TutorConnect</text>

  <!-- Actors -->
  <g transform="translate(120 195)">
    <circle cx="0" cy="0" r="24" class="actor"/>
    <line x1="0" y1="24" x2="0" y2="92" class="actor"/>
    <line x1="-42" y1="48" x2="42" y2="48" class="actor"/>
    <line x1="0" y1="92" x2="-36" y2="142" class="actor"/>
    <line x1="0" y1="92" x2="36" y2="142" class="actor"/>
    <text x="0" y="182" text-anchor="middle" class="actor-label">Student/Parent</text>
  </g>

  <g transform="translate(120 505)">
    <circle cx="0" cy="0" r="24" class="actor"/>
    <line x1="0" y1="24" x2="0" y2="92" class="actor"/>
    <line x1="-42" y1="48" x2="42" y2="48" class="actor"/>
    <line x1="0" y1="92" x2="-36" y2="142" class="actor"/>
    <line x1="0" y1="92" x2="36" y2="142" class="actor"/>
    <text x="0" y="182" text-anchor="middle" class="actor-label">Tutor</text>
  </g>

  <g transform="translate(1275 350)">
    <circle cx="0" cy="0" r="24" class="actor"/>
    <line x1="0" y1="24" x2="0" y2="92" class="actor"/>
    <line x1="-42" y1="48" x2="42" y2="48" class="actor"/>
    <line x1="0" y1="92" x2="-36" y2="142" class="actor"/>
    <line x1="0" y1="92" x2="36" y2="142" class="actor"/>
    <text x="0" y="182" text-anchor="middle" class="actor-label">Admin</text>
  </g>

  <!-- Shared auth use case -->
  <ellipse cx="705" cy="185" rx="150" ry="38" class="usecase"/>
  <text x="705" y="193" text-anchor="middle" class="label">Đăng ký / đăng nhập</text>

  <!-- Student/Parent use cases -->
  <ellipse cx="515" cy="285" rx="130" ry="38" class="usecase"/>
  <text x="515" y="293" text-anchor="middle" class="label">Tìm kiếm gia sư</text>

  <ellipse cx="830" cy="285" rx="128" ry="38" class="usecase"/>
  <text x="830" y="293" text-anchor="middle" class="label">Xem chi tiết</text>

  <ellipse cx="515" cy="385" rx="105" ry="38" class="usecase"/>
  <text x="515" y="393" text-anchor="middle" class="label">Đặt lịch</text>

  <ellipse cx="830" cy="385" rx="115" ry="38" class="usecase"/>
  <text x="830" y="393" text-anchor="middle" class="label">Thanh toán</text>

  <ellipse cx="515" cy="485" rx="100" ry="38" class="usecase"/>
  <text x="515" y="493" text-anchor="middle" class="label">Nhắn tin</text>

  <ellipse cx="830" cy="485" rx="105" ry="38" class="usecase"/>
  <text x="830" y="493" text-anchor="middle" class="label">Đánh giá</text>

  <!-- Tutor use cases -->
  <ellipse cx="515" cy="595" rx="105" ry="38" class="usecase"/>
  <text x="515" y="603" text-anchor="middle" class="label">Tạo hồ sơ</text>

  <ellipse cx="830" cy="595" rx="100" ry="38" class="usecase"/>
  <text x="830" y="603" text-anchor="middle" class="label">Tải tài liệu</text>

  <ellipse cx="515" cy="690" rx="100" ry="38" class="usecase"/>
  <text x="515" y="698" text-anchor="middle" class="label">Gửi duyệt</text>

  <ellipse cx="830" cy="690" rx="135" ry="38" class="usecase"/>
  <text x="830" y="698" text-anchor="middle" class="label">Quản lý lịch rảnh</text>

  <ellipse cx="1040" cy="595" rx="110" ry="38" class="usecase"/>
  <text x="1040" y="603" text-anchor="middle" class="label">Theo dõi booking</text>

  <ellipse cx="1040" cy="690" rx="85" ry="38" class="usecase"/>
  <text x="1040" y="698" text-anchor="middle" class="label">Quản lý ví</text>

  <!-- Admin use cases -->
  <ellipse cx="1005" cy="190" rx="125" ry="38" class="usecase"/>
  <text x="1005" y="198" text-anchor="middle" class="label">Duyệt/từ chối gia sư</text>

  <ellipse cx="1005" cy="285" rx="105" ry="38" class="usecase"/>
  <text x="1005" y="293" text-anchor="middle" class="label">Quản lý user</text>

  <ellipse cx="1005" cy="385" rx="145" ry="38" class="usecase"/>
  <text x="1005" y="393" text-anchor="middle" class="label">Theo dõi booking/payment</text>

  <ellipse cx="1005" cy="485" rx="145" ry="38" class="usecase"/>
  <text x="1005" y="493" text-anchor="middle" class="label">Xử lý refund/withdrawal</text>

  <ellipse cx="1005" cy="95" rx="105" ry="38" class="usecase"/>
  <text x="1005" y="103" text-anchor="middle" class="label">Xem audit log</text>

  <!-- Associations Student/Parent -->
  <line x1="170" y1="260" x2="555" y2="185" class="line"/>
  <line x1="170" y1="260" x2="385" y2="285" class="line"/>
  <line x1="170" y1="260" x2="704" y2="285" class="line"/>
  <line x1="170" y1="260" x2="410" y2="385" class="line"/>
  <line x1="170" y1="260" x2="715" y2="385" class="line"/>
  <line x1="170" y1="260" x2="415" y2="485" class="line"/>
  <line x1="170" y1="260" x2="725" y2="485" class="line"/>

  <!-- Associations Tutor -->
  <line x1="170" y1="570" x2="555" y2="185" class="line"/>
  <line x1="170" y1="570" x2="410" y2="595" class="line"/>
  <line x1="170" y1="570" x2="730" y2="595" class="line"/>
  <line x1="170" y1="570" x2="415" y2="690" class="line"/>
  <line x1="170" y1="570" x2="695" y2="690" class="line"/>
  <line x1="170" y1="570" x2="930" y2="595" class="line"/>
  <line x1="170" y1="570" x2="955" y2="690" class="line"/>

  <!-- Associations Admin -->
  <line x1="1230" y1="415" x2="855" y2="185" class="line"/>
  <line x1="1230" y1="415" x2="1125" y2="190" class="line"/>
  <line x1="1230" y1="415" x2="1110" y2="285" class="line"/>
  <line x1="1230" y1="415" x2="1150" y2="385" class="line"/>
  <line x1="1230" y1="415" x2="1150" y2="485" class="line"/>
  <line x1="1230" y1="415" x2="1110" y2="95" class="line"/>
</svg>
