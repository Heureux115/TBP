    <text class="field" x="14" y="66">PK id</text>
    <text class="field" x="14" y="92">FK booking_id</text>
    <text class="field" x="14" y="118">FK student_id</text>
    <text class="field" x="14" y="144">rating, comment</text>
  </g>

  <g transform="translate(60 620)">
    <rect class="entity" width="270" height="170"/>
    <rect class="head" width="270" height="38"/>
    <text class="ename" x="135" y="26" text-anchor="middle">tutor_documents</text>
    <text class="field" x="14" y="66">PK id</text>
    <text class="field" x="14" y="92">FK tutor_profile_id</text>
    <text class="field" x="14" y="118">type, status</text>
    <text class="field" x="14" y="144">file_name, file_path</text>
  </g>

  <g transform="translate(410 620)">
    <rect class="entity" width="270" height="170"/>
    <rect class="head" width="270" height="38"/>
    <text class="ename" x="135" y="26" text-anchor="middle">conversations</text>
    <text class="field" x="14" y="66">PK id</text>
    <text class="field" x="14" y="92">FK booking_id</text>
    <text class="field" x="14" y="118">created_at, updated_at</text>
  </g>

  <g transform="translate(760 620)">
    <rect class="entity" width="270" height="170"/>
    <rect class="head" width="270" height="38"/>
    <text class="ename" x="135" y="26" text-anchor="middle">messages</text>
    <text class="field" x="14" y="66">PK id</text>
    <text class="field" x="14" y="92">FK conversation_id</text>
    <text class="field" x="14" y="118">FK sender_id</text>
    <text class="field" x="14" y="144">body, created_at</text>
  </g>

  <g transform="translate(1110 620)">
    <rect class="entity" width="270" height="170"/>
    <rect class="head" width="270" height="38"/>
    <text class="ename" x="135" y="26" text-anchor="middle">admin_audit_logs</text>
    <text class="field" x="14" y="66">PK id</text>
    <text class="field" x="14" y="92">FK actor_id</text>
    <text class="field" x="14" y="118">action, resource_type</text>
    <text class="field" x="14" y="144">reason, created_at</text>
  </g>

  <g transform="translate(410 875)">
    <rect class="entity" width="270" height="145"/>
    <rect class="head" width="270" height="38"/>
    <text class="ename" x="135" y="26" text-anchor="middle">tutor_wallets</text>
    <text class="field" x="14" y="66">PK id</text>
    <text class="field" x="14" y="92">FK tutor_profile_id</text>
    <text class="field" x="14" y="118">available_balance</text>
  </g>

  <g transform="translate(760 875)">
    <rect class="entity" width="270" height="145"/>
    <rect class="head" width="270" height="38"/>
    <text class="ename" x="135" y="26" text-anchor="middle">withdrawals</text>
    <text class="field" x="14" y="66">PK id</text>
    <text class="field" x="14" y="92">FK wallet_id</text>
    <text class="field" x="14" y="118">amount, status, bank_*</text>
  </g>

