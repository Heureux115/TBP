<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Times New Roman", serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .entity { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .head { fill: #d9eaf7; stroke: #111827; stroke-width: 2; }
      .ename { font-family: "Times New Roman", serif; font-size: 22px; font-weight: 700; fill: #111827; }
      .field { font-family: "Times New Roman", serif; font-size: 18px; fill: #111827; }
      .rel { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .note { font-family: "Times New Roman", serif; font-size: 18px; fill: #374151; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1080"/>
  <text class="title" x="800" y="50" text-anchor="middle">Sơ đồ ERD hệ thống TutorConnect</text>

  <!-- Entity helper pattern: rect 260x150, header 36 -->

  <g transform="translate(60 100)">
    <rect class="entity" width="270" height="170"/>
    <rect class="head" width="270" height="38"/>
    <text class="ename" x="135" y="26" text-anchor="middle">users</text>
    <text class="field" x="14" y="66">PK id</text>
    <text class="field" x="14" y="92">email, full_name, phone</text>
    <text class="field" x="14" y="118">role, status</text>
    <text class="field" x="14" y="144">created_at, updated_at</text>
  </g>

  <g transform="translate(410 100)">
    <rect class="entity" width="270" height="170"/>
    <rect class="head" width="270" height="38"/>
    <text class="ename" x="135" y="26" text-anchor="middle">tutor_profiles</text>
    <text class="field" x="14" y="66">PK id</text>
    <text class="field" x="14" y="92">FK user_id</text>
    <text class="field" x="14" y="118">headline, bio, hourly_rate</text>
    <text class="field" x="14" y="144">verification_status</text>
  </g>

  <g transform="translate(760 100)">
    <rect class="entity" width="270" height="170"/>
    <rect class="head" width="270" height="38"/>
    <text class="ename" x="135" y="26" text-anchor="middle">subjects</text>
    <text class="field" x="14" y="66">PK id</text>
    <text class="field" x="14" y="92">name, slug</text>
    <text class="field" x="14" y="118">category, is_active</text>
    <text class="field" x="14" y="144">created_at, updated_at</text>
  </g>

  <g transform="translate(1110 100)">
    <rect class="entity" width="270" height="170"/>
    <rect class="head" width="270" height="38"/>
    <text class="ename" x="135" y="26" text-anchor="middle">tutor_subjects</text>
    <text class="field" x="14" y="66">PK id</text>
    <text class="field" x="14" y="92">FK tutor_profile_id</text>
    <text class="field" x="14" y="118">FK subject_id</text>
    <text class="field" x="14" y="144">level</text>
  </g>

  <g transform="translate(60 360)">
    <rect class="entity" width="270" height="170"/>
    <rect class="head" width="270" height="38"/>
    <text class="ename" x="135" y="26" text-anchor="middle">availability_slots</text>
    <text class="field" x="14" y="66">PK id</text>
    <text class="field" x="14" y="92">FK tutor_profile_id</text>
    <text class="field" x="14" y="118">starts_at, ends_at</text>
    <text class="field" x="14" y="144">is_booked</text>
